stages:
  - build
  - deploy

variables:
  AWS_DEFAULT_REGION: eu-west-3
  ECR_REGISTRY: '<AWS_ACCOUNT_ID>.dkr.ecr.eu-west-3.amazonaws.com'
  ECR_REPOSITORY: 'jobtrack-messagerie'
  IMAGE_TAG: '$CI_COMMIT_SHORT_SHA'
  DEPLOY_PATH: '/opt/jobtrack/messagerie'

build:
  stage: build
  image: docker:24
  services:
    - docker:24-dind
  before_script:
    # Alpine (docker:24, musl) : tout outil basé sur un CPython lié glibc
    # (apk aws-cli, pip awscli...) plante à l'exécution. Le binaire officiel
    # AWS CLI v2 est lui aussi lié glibc -> gcompat (compat glibc pour musl)
    # est requis pour qu'il tourne ici, sinon même symptôme sous une autre forme.
    - apk add --no-cache curl unzip gcompat
    - curl "https://awscli.amazonaws.com/awscli-exe-linux-x86_64.zip" -o "awscliv2.zip"
    - unzip -q awscliv2.zip
    - ./aws/install
    - rm -rf awscliv2.zip aws/
    - export PATH="/usr/local/bin:$PATH"
    - aws --version
    - export AWS_ACCESS_KEY_ID="$GITLAB_AWS_ACCESS_KEY_ID"
    - export AWS_SECRET_ACCESS_KEY="$GITLAB_AWS_SECRET_ACCESS_KEY"
    - aws ecr get-login-password --region "$AWS_DEFAULT_REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"
  script:
    - docker build -t "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" -t "$ECR_REGISTRY/$ECR_REPOSITORY:latest" .
    - docker push "$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG"
    - docker push "$ECR_REGISTRY/$ECR_REPOSITORY:latest"
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'

deploy:
  stage: deploy
  image: alpine:3.20
  before_script:
    - apk add --no-cache openssh-client
    - eval $(ssh-agent -s)
    - echo "$SSH_PRIVATE_KEY" | tr -d '\r' | ssh-add -
    - mkdir -p ~/.ssh && chmod 700 ~/.ssh
    - ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts
  script:
    - >
      ssh "$EC2_USER@$EC2_HOST"
      "cd $DEPLOY_PATH &&
      export ECR_REGISTRY=$ECR_REGISTRY IMAGE_TAG=$IMAGE_TAG &&
      docker compose -f docker-compose.prod.yml pull &&
      docker compose -f docker-compose.prod.yml up -d &&
      docker image prune -f"
  rules:
    - if: '$CI_COMMIT_BRANCH == "develop"'
